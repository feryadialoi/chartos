[package]
name = "chartos"
version = "0.1.0"
edition = "2024"
description = "Render Grafana dashboards as true color charts in the terminal"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive", "env"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
debug = 0
